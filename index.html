<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>BUDDY</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#app{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(
            circle at center,
            rgba(40,100,255,.10),
            transparent 38%
        ),
        #000;
}

/* =================================
   ENERGY FIELD
================================= */

.energy{
    position:absolute;
    left:50%;
    top:50%;
    width:100vw;
    height:420px;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.wave{
    position:absolute;
    top:50%;
    width:55vw;
    height:260px;
    transform:translateY(-50%);
}

.wave.left{
    right:50%;
}

.wave.right{
    left:50%;
    transform:translateY(-50%) scaleX(-1);
}

.wave span{
    position:absolute;
    left:0;
    top:50%;

    width:100%;
    height:2px;

    border-radius:100%;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            #00eaff 25%,
            #477cff 55%,
            #9b45ff 75%,
            transparent 100%
        );

    box-shadow:
        0 0 5px #00dfff,
        0 0 14px rgba(80,110,255,.8);

    transform-origin:left center;

    animation:energyMove 2.2s
              ease-in-out infinite;
}

.wave span:nth-child(1){
    transform:translateY(-100px) rotate(9deg);
    animation-delay:-.2s;
}

.wave span:nth-child(2){
    transform:translateY(-70px) rotate(-7deg);
    animation-delay:-.7s;
}

.wave span:nth-child(3){
    transform:translateY(-38px) rotate(5deg);
    animation-delay:-1.1s;
}

.wave span:nth-child(4){
    transform:translateY(0) rotate(-4deg);
    animation-delay:-.4s;
}

.wave span:nth-child(5){
    transform:translateY(38px) rotate(6deg);
    animation-delay:-1.5s;
}

.wave span:nth-child(6){
    transform:translateY(70px) rotate(-8deg);
    animation-delay:-.9s;
}

.wave span:nth-child(7){
    transform:translateY(100px) rotate(8deg);
    animation-delay:-1.8s;
}

@keyframes energyMove{

    0%,100%{
        opacity:.22;
        filter:blur(3px);
        scale:.82 1;
    }

    50%{
        opacity:1;
        filter:blur(.2px);
        scale:1.08 1.8;
    }
}

.listening .wave span{
    animation-duration:.75s;
}

.speaking .wave span{
    animation-duration:.42s;
}

/* =================================
   EXTRA PARTICLE GLOW
================================= */

.energy::before,
.energy::after{
    content:"";
    position:absolute;

    top:50%;
    width:55vw;
    height:220px;

    transform:translateY(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(0,210,255,.18),
            transparent 65%
        );

    filter:blur(22px);

    pointer-events:none;
}

.energy::before{
    right:50%;
}

.energy::after{
    left:50%;
}

/* =================================
   BUDDY CORE
================================= */

.core{
    position:absolute;

    left:50%;
    top:50%;

    width:190px;
    height:190px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #a7f8ff 0%,
            #54bfff 12%,
            #5268ff 35%,
            #5628c9 57%,
            #160d42 78%,
            #02020a 100%
        );

    box-shadow:
        0 0 22px #00d9ff,
        0 0 55px rgba(50,100,255,.8),
        0 0 110px rgba(130,50,255,.38),
        inset 0 0 45px rgba(255,255,255,.14);

    z-index:10;
}

/* Internal glow */

.core::before{
    content:"";

    position:absolute;
    inset:9px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.28);

    box-shadow:
        inset 0 0 35px
        rgba(0,230,255,.5);
}

.core::after{
    content:"";

    position:absolute;
    inset:20px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 40% 30%,
            rgba(255,255,255,.14),
            transparent 55%
        );
}

/* =================================
   FACE
================================= */

.face{
    position:absolute;
    inset:0;
    z-index:2;
}

.eye{
    position:absolute;

    top:67px;

    width:32px;
    height:14px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #fff,
        0 0 20px #55edff;

    animation:blink 5s infinite;
}

.eye.left{
    left:42px;
}

.eye.right{
    right:42px;
}

@keyframes blink{

    0%,45%,48%,100%{
        transform:scaleY(1);
    }

    46%,47%{
        transform:scaleY(.08);
    }
}

/* =================================
   MOUTH
================================= */

.mouth{
    position:absolute;

    left:50%;
    bottom:48px;

    width:58px;
    height:20px;

    transform:translateX(-50%);

    border-bottom:
        4px solid white;

    border-radius:
        0 0 50px 50px;

    filter:
        drop-shadow(0 0 8px #5cecff);
}

.speaking .mouth{
    animation:
        talking .16s
        infinite alternate;
}

@keyframes talking{

    from{
        height:8px;
        width:48px;
    }

    to{
        height:30px;
        width:62px;
    }
}

/* =================================
   STATUS
================================= */

#status{
    position:absolute;

    left:50%;
    bottom:108px;

    transform:translateX(-50%);

    color:
        rgba(255,255,255,.65);

    font-size:13px;

    white-space:nowrap;

    z-index:20;
}

/* =================================
   MIC
================================= */

#mic{
    position:absolute;

    left:50%;
    bottom:32px;

    transform:translateX(-50%);

    width:64px;
    height:64px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        radial-gradient(
            circle,
            rgba(60,180,255,.28),
            rgba(20,20,35,.9)
        );

    color:#fff;

    font-size:25px;

    cursor:pointer;

    z-index:30;

    box-shadow:
        0 0 20px
        rgba(0,200,255,.35);
}

#mic:active{
    transform:
        translateX(-50%)
        scale(.94);
}

/* =================================
   MOBILE
================================= */

@media(max-width:500px){

    .core{
        width:175px;
        height:175px;
    }

    .wave{
        width:60vw;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- ENERGY -->

    <div class="energy">

        <div class="wave left">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="wave right">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>


    <!-- BUDDY -->

    <div class="core">

        <div class="face">

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="mouth"></div>

        </div>

    </div>


    <div id="status">
        Tap the microphone
    </div>


    <button id="mic">
        🎙️
    </button>

</div>


<script>

/* =================================
   BUDDY ENGINE
================================= */

const app =
    document.getElementById("app");

const mic =
    document.getElementById("mic");

const statusText =
    document.getElementById("status");


/* =================================
   SPEECH RECOGNITION
================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "en-IN";


    recognition.onstart = () => {

        app.classList.add("listening");

        statusText.textContent =
            "Listening...";
    };


    recognition.onresult = event => {

        const text =
            event.results[0][0]
            .transcript;

        statusText.textContent =
            text;

        processCommand(text);
    };


    recognition.onerror = event => {

        app.classList.remove(
            "listening"
        );

        statusText.textContent =
            "Voice error: " +
            event.error;
    };


    recognition.onend = () => {

        app.classList.remove(
            "listening"
        );
    };

}


/* =================================
   MICROPHONE BUTTON
================================= */

mic.addEventListener(
    "click",
    () => {

        if(!recognition){

            speak(
                "Boss, voice recognition is not supported in this browser."
            );

            return;
        }

        try{

            recognition.start();

        }catch(error){

            console.log(error);

        }

    }
);


/* =================================
   COMMAND SYSTEM
================================= */

function processCommand(text){

    const command =
        text.toLowerCase().trim();


    /* Greeting */

    if(
        command.includes("hello") ||
        command.includes("hi buddy") ||
        command.includes("hey buddy")
    ){

        speak(
            "Yes boss. I am here."
        );

        return;
    }


    /* How are you */

    if(
        command.includes(
            "how are you"
        )
    ){

        speak(
            "I am doing great, boss. How are you?"
        );

        return;
    }


    /* What are you doing */

    if(
        command.includes(
            "what are you doing"
        )
    ){

        speak(
            "I am waiting for your next command, boss."
        );

        return;
    }


    /* Time */

    if(
        command.includes("time")
    ){

        const now =
            new Date();

        const time =
            now.toLocaleTimeString(
                "en-IN",
                {
                    hour:"numeric",
                    minute:"2-digit"
                }
            );

        speak(
            "Boss, the time is " +
            time
        );

        return;
    }


    /* Date */

    if(
        command.includes("date") ||
        command.includes("today")
    ){

        const now =
            new Date();

        const date =
            now.toLocaleDateString(
                "en-IN",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            );

        speak(
            "Boss, today is " +
            date
        );

        return;
    }


    /* Joke */

    if(
        command.includes("joke")
    ){

        speak(
            "Why did the computer go to the doctor? Because it had a virus."
        );

        return;
    }


    /* Marathi */

    if(
        command.includes("marathi")
    ){

        speak(
            "Boss, मी एकदम मस्त आहे. तुम्ही कसे आहात?"
        );

        return;
    }


    /* Open YouTube */

    if(
        command.includes(
            "open youtube"
        )
    ){

        speak(
            "Opening YouTube, boss."
        );

        setTimeout(
            () => {

                window.open(
                    "https://www.youtube.com",
                    "_blank"
                );

            },
            900
        );

        return;
    }


    /* Open Google */

    if(
        command.includes(
            "open google"
        )
    ){

        speak(
            "Opening Google, boss."
        );

        setTimeout(
            () => {

                window.open(
                    "https://www.google.com",
                    "_blank"
                );

            },
            900
        );

        return;
    }


    /* Search Google */

    if(
        command.startsWith(
            "search "
        )
    ){

        const query =
            command.substring(7);

        speak(
            "Searching for " +
            query +
            ", boss."
        );

        setTimeout(
            () => {

                window.open(
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(query),
                    "_blank"
                );

            },
            900
        );

        return;
    }


    /* Unknown */

    speak(
        "I heard you say " +
        text +
        ". I am still learning that command, boss."
    );
}


/* =================================
   TEXT TO SPEECH
================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        statusText.textContent =
            "Speech is not supported.";

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang = "en-IN";

    utterance.rate = 0.95;

    utterance.pitch = 1.05;

    utterance.volume = 1;


    const voices =
        window.speechSynthesis
        .getVoices();


    const preferred =
        voices.find(
            voice =>
                voice.lang
                .toLowerCase()
                .includes("en-in")
        );


    if(preferred){

        utterance.voice =
            preferred;
    }


    utterance.onstart = () => {

        app.classList.add(
            "speaking"
        );

        statusText.textContent =
            "BUDDY is speaking...";
    };


    utterance.onend = () => {

        app.classList.remove(
            "speaking"
        );

        statusText.textContent =
            "Tap the microphone";
    };


    utterance.onerror = () => {

        app.classList.remove(
            "speaking"
        );

        statusText.textContent =
            "Speech error";
    };


    window.speechSynthesis
        .speak(utterance);
}


/* Load voices */

window.speechSynthesis
    .addEventListener(
        "voiceschanged",
        () => {

            window.speechSynthesis
                .getVoices();

        }
    );

</script>

</body>
</html>
